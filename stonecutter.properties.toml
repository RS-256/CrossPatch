# Mod metadata — shared across all versions
mod.id      = "crosspatch"
mod.name    = "crossPatch"
mod.version = "0.3.8"
mod.group   = "com.rs256.crossPatch"

# deps. is used dependency resolving,
# build. is used build jar resource prosessing
#
# maven.modrinth accepts either a version number or a version id. Prefer the
# readable number, but flashback reuses one number across several MC builds
# (0.39.8 exists for 1.21 through 1.21.11), so it has to stay pinned by id.
deps.fabric_loader  = "0.19.5"
build.fabric_loader = ">=0.19.5"

build.fabric_api    = "*"
build.modmenu       = "*"
build.malilib       = "*"
build.litematica    = "*"
build.itemscroller  = "*"
build.tweakermore   = "*"
build.flashback     = "*"
build.bobby         = "*"

publish.modrinth   = "BVBbOmXq"
publish.curseforge = "XXXXXXXX"
publish.github     = "RS-256/CrossPatch"

# Per-version properties
["1.21.11"]
deps.fabric_api = "0.141.6+1.21.11"
mod.mc_dep      = "1.21.11"
mod.mc_title    = "1.21.11"
mod.mc_targets  = "1.21.11"
# build.fabric_api = "0.141.3+1.21.11"     # additional if needed

deps.modmenu = "17.0.1-beta.1"
deps.malilib  = "0.27.19"
